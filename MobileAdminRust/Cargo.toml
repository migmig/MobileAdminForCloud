[package]
name = "mobile-admin"
version = "0.1.0"
edition = "2021"
description = "MobileAdminForCloud 의 Rust + Slint 데스크톱 버전"

[dependencies]
slint = "1.18"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
base64 = "0.22"
dirs = "6"

[build-dependencies]
slint-build = "1.18"

[profile.release]
opt-level = 3
lto = "thin"
