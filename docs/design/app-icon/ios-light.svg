<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B82F6"/><stop offset=".55" stop-color="#4F46E5"/><stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="lg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563EB"/><stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="cg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#60A5FA"/><stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="tg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#BDBDBD"/>
    </linearGradient>
    <radialGradient id="glow" cx=".3" cy=".2" r=".9">
      <stop offset="0" stop-color="#fff" stop-opacity="0.28"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>
  <!-- cloud -->
  <g filter="url(#sh)">
    <path fill="#FFFFFF" d="
      M 300 720
      C 210 720 150 652 150 572
      C 150 494 208 432 284 424
      C 300 330 382 262 482 262
      C 570 262 644 314 676 392
      C 694 386 712 384 732 384
      C 820 384 884 452 884 552
      C 884 646 814 720 724 720 Z"/>
  </g>
  <!-- bars -->
  <rect x="318" y="560" width="64" height="100" rx="18" fill="url(#lg)" opacity=".9"/>
  <rect x="414" y="500" width="64" height="160" rx="18" fill="url(#lg)" opacity=".9"/>
  <!-- pulse line -->
  <polyline points="510,600 560,600 600,470 650,650 690,540 720,600 760,600"
    fill="none" stroke="url(#lg)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>